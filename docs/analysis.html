              <h1>OUR ANALYSIS</h1>
              <p> For our analysis we went over on how many difference there was between the manga and anime. We are focusing on dialouge to see what
                 was left out during the transition from manga to anime. Below are what we found different bewteen the anime and manga.
              </p>
                  <ul>
                      <li>
                          <b>Episode 1 & Manga Chapter 1</b>
                          <p>In the first chapter of the manga there are 387 lines of dialouge. While in the anime there are 165 dialouge. In one of the
                          first scenes when Momo is talking with her friends in the manga she says "That's not even funny! Moron! Fish Brain! Squid!
                          Octopus!" while in the anime she says "Gimme ya break, moron! Octopus! Squid! Tuna!. In the manga Ken mentions specifically
                          that the president is Obama while in the anime is it not mentioned who the president is.</p>
                      </li>
                      <li>
                          <b>Episode 2 & Manga Chapter 2</b>
                          <p>In the second chapter of manga there are 346 lines of dialouge while the anime has 174 lines of dialouge. In the manga Ken
                          notices manages to recognize the monster by it's hood while in the anime he recognizes it by it's collar. When Momo and Ken get to the entrance
                          Of Momo's house the talisman is different in both the manga and anime. During the end where Momo falls unconcious Ken manages to 
                          say a few more line before succumbing to Turbo Granny"s possession. When the alien interacts with Momo and Ken in the anime he says
                          "Give me...your banana. While in the manga he says "Hand over your...organs. In the anime whenever Ken access the powers of Turbo Granny
                          he adds yo to his sentences which is not present in the manga.</p>
                      </li>
                      <li>
                          <b>Episode 3 & Manga Chapter 3</b>
                          <p>In the third chapter of the manga there are 287 line of dialouge and while the anime has 205 lines of dialouge and while it takes from both the
                          third and fourth chapters we'll focus on the third for this analysis. In the scene where Seiko is watching TV, there are two different interplations
                          in the anime she says Idiot Shogun. While in the manga she says Bakatono. In the following scene, Momo says she has physic powers in the anime.
                          In the manga shes says she has parnormal powers. When Seiko is talking about bound spirits she refers to them as location-bound spirits in the anime.
                          </p>
                      </li>
                  </ul>
              <p>The anime tends to expand on certain scenes in the manga to give room for character development and worldbuiling. While the manga gives alot more
              detail about the characters and their enviroment. The anime does condense their manga source as they only have a limited time to tell as much of the story as
              they can and they also add orginal scenes to give the anime more comedic moments or add flair to the show.</p>
