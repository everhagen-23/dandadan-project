        <p> For this Project we used the transcripts from the DanDaDan manga and anime as a base, going in with XML to
            label each line of text. <b>We found [X] things important to label here: </b></p>
        <ul>
            <li><b>Names:</b> Very obviously important, we labelled each character with consistent character names. In
                the manga transcripts we encoded with []. In the anime transcripts we encoded with []
            </li>
            <li><b>Diegetic Text:</b> There are magazines and location signs in this media, and we wanted to compare the
                two. In
                the manga transcripts we encoded with []. In the anime transcripts we encoded with []
            </li>
            <li><b>Scenes:</b> To help divide the manga and anime into easily digestible segments we chose important
                points to "break" the text into, making it easier to analyze in smaller chunks. In
                the manga and anime transcripts we encoded with div and id elements.
            </li>
        </ul>
        <iframe class="dataFrame" src="../xml/manga/is-1tei.xml"></iframe>
        <iframe class="dataFrame" src="../xml/tv-transcripts/ep-1tei.xml"></iframe>
