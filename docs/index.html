        <p> Our project is centered around the DanDaDan series, comparing both the anime and
            the manga. The manga was adapted into an anime in 2024, with two seasons
            currently out and more on the way in the future. With this project we have taken
            the first three episodes and the four corresponding manga issues and encoded
            them via XML to compare the differences. In this project (And throughout this
            website), we will cover differences and similarities in length, locations,
            movements, and spoken lines between these two mediums. Many plot beats remain
            the same in the first few episodes, however there must be differences in any
            adaption, to learn more check out our <a href="data.html">Data</a> and <a
                    href="analysis.html">Analysis</a> pages</p></section>
