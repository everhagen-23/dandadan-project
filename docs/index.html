        <p> Our project is centered around the DanDaDan series, comparing both the anime and
            the manga. The manga was adapted into an anime in 2024, with two seasons
            currently out and more on the way in the future. With this project we have taken
            the first three episodes and the four corresponding manga issues and encoded
            them via XML to compare the differences. In this project (And throughout this
            website), we will cover differences and similarities in length, locations,
            movements, and spoken lines between these two mediums. Many plot beats remain
            the same in the first few episodes, however there must be differences in any
            adaption, to learn more check out our <a href="data.html">Data</a> and <a
                    href="analysis.html">Analysis</a> pages</p></section>
    <section>
        <h1>What's DanDaDan About?</h1>
        <div><a onclick="myAudioFunction('explanation');"><img
                src="support/f2.png" width="200" class="left"
                alt="Okarun and Momo running"/></a></div>
        <p> DanDaDan is an action/romance manga that was adapted into an anime in []. The sections that we covered
            follow main
            characters Momo and Ken (commonly
            nicknamed "Okarun") as they look to disprove each other's theories on yokai and aliens. From the moment they
            meet they disagree on the validity and existence of yokai and aliens, with Ken believing in aliens and Momo
            believing in yokai, as a result they challenge each other to go to supernatural locations to prove their
            ideas. Momo goes to a hospital and proceeds to be abducted by aliens and is bestowed incredibly strong
            psychic powers, Ken is not as lucky and is both cursed and possessed by the spirit of an old woman. The
            story follows the characters as they work to uncurse Ken, along with expanding both their cast of friends
            and enemies.</p>
    </section>
